<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dupe Therapist</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; }

.toolbar {
  position: sticky; top: 0; z-index: 100;
  background: #16213e; padding: 10px 20px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 2px solid #0f3460;
}
.toolbar h1 { font-size: 18px; color: #e94560; }
button {
  background: #0f3460; color: #e0e0e0; border: 1px solid #533483;
  padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px;
}
button:hover { background: #533483; }
button.active { background: #533483; border-color: #e94560; }
.commit-btn { background: #e94560; border-color: #e94560; }
.commit-btn:hover { background: #c23152; }
.commit-btn:disabled { background: #444; border-color: #444; cursor: default; }
.badge {
  background: #e94560; color: white; border-radius: 10px;
  padding: 2px 8px; font-size: 12px; margin-left: 4px; display: none;
}
.status { font-size: 12px; color: #888; margin-left: auto; }
.sep { width: 1px; height: 24px; background: #533483; }

/* Grid */
.grid-wrap { overflow: auto; max-height: calc(100vh - 50px); }
table { border-collapse: collapse; }
th, td { border: 1px solid #2a2a4a; padding: 3px 5px; text-align: center; font-size: 13px; }
thead th { position: sticky; background: #16213e; z-index: 10; }
tr.group-row th { top: 0; z-index: 11; }
tr.col-row th { top: 28px; z-index: 10; }

/* Group header */
th.group {
  background: #0f3460; cursor: pointer; font-size: 12px; font-weight: bold;
  padding: 4px 8px; white-space: nowrap; user-select: none;
  border-left: 3px solid #533483;
}
th.group:hover { background: #533483; }
th.group .arrow { font-size: 10px; margin-right: 4px; }
th.collapsed-placeholder {
  width: 20px; min-width: 20px; max-width: 20px;
  background: #0f3460; cursor: pointer; writing-mode: vertical-lr;
  text-orientation: mixed; font-size: 10px; color: #888; padding: 2px;
  border-left: 3px solid #533483;
}

th.rotated {
  height: 90px; min-width: 28px; padding: 4px 2px;
  vertical-align: bottom;
}
th.rotated span {
  writing-mode: vertical-rl; transform: rotate(180deg);
  font-size: 11px; line-height: 1.1;
}
th.sort { cursor: pointer; }
th.sort:hover { color: #e94560; }

td.name {
  position: sticky; left: 0; background: #1a1a2e; z-index: 5;
  text-align: left; font-weight: bold; padding: 4px 10px; white-space: nowrap;
  cursor: pointer;
}
td.name:hover { color: #e94560; }
td.name img.portrait {
  width: 28px; height: 28px; vertical-align: middle; margin-right: 6px;
  border-radius: 4px; background: #2a2a4a;
}
td.name .rename-btn {
  font-size: 10px; color: #555; cursor: pointer; margin-left: 6px; visibility: hidden;
}
td.name:hover .rename-btn { visibility: visible; color: #e94560; }
td.info {
  text-align: left; font-size: 11px; color: #aaa;
  white-space: normal;
}
.interest { color: #4fc3f7; }
.trait { color: #ce93d8; }
.skill { color: #81c784; }
.equip { color: #ffa726; }
.bionic-tag { color: #00e5ff; font-size: 10px; margin-left: 4px; }
td.vital { font-size: 12px; white-space: nowrap; }
.v-good { color: #81c784; }
.v-warn { color: #ffb74d; }
.v-bad { color: #e57373; }
.v-neutral { color: #aaa; }

td.prio {
  width: 34px; min-width: 34px; height: 28px;
  cursor: pointer; user-select: none; font-weight: bold; font-size: 14px;
}
td.prio:hover { outline: 2px solid #e94560; outline-offset: -2px; }
td.prio.changed { outline: 2px solid #ffd700; outline-offset: -2px; }
td.prio.disabled { cursor: not-allowed; opacity: 0.3; background: #1a1a2e !important; }
td.prio.disabled:hover { outline: none; }

td.exposure { font-size: 11px; min-width: 34px; }
td.exposure.None { color: #555; }
td.exposure.Contact { background: hsl(50,40%,20%); color: #dda; }
td.exposure.Exposed { background: hsl(30,50%,22%); color: #eca; }
td.exposure.Contracted { background: hsl(10,55%,25%); color: #eaa; }
td.exposure.Sick { background: hsl(0,60%,30%); color: #fbb; font-weight: bold; }

td.collapsed-cell {
  width: 20px; min-width: 20px; max-width: 20px;
  background: #12122a; border-left: 3px solid #533483;
}

/* Selection */
tr.selected td { background-color: rgba(233,69,96,0.12) !important; }
tr.selected td.name { background: #2a1a2e !important; }
td.sel-check { width: 24px; min-width: 24px; padding: 0; cursor: pointer; }
td.sel-check input { cursor: pointer; }

/* Bulk bar */
.bulk-bar {
  display: none; position: sticky; top: 50px; z-index: 99;
  background: #1a0f2e; border: 2px solid #e94560; border-radius: 0 0 8px 8px;
  padding: 8px 16px; margin: 0 20px;
  align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px;
}
.bulk-bar.visible { display: flex; }
.bulk-bar select, .bulk-bar input[type=number] {
  background: #0f3460; color: #e0e0e0; border: 1px solid #533483;
  padding: 3px 6px; border-radius: 4px; font-size: 13px;
}
.bulk-bar input[type=number] { width: 50px; }
.bulk-bar .label { color: #888; }
.bulk-bar button { padding: 4px 10px; font-size: 12px; }
.bulk-bar .count { color: #e94560; font-weight: bold; }

/* Chart view */
.chart-view { display: none; padding: 20px; max-height: calc(100vh - 50px); overflow: auto; }
.chart-view.visible { display: block; }
.chart-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.chart-header h2 { color: #e94560; font-size: 16px; }
.chart-header select {
  background: #0f3460; color: #e0e0e0; border: 1px solid #533483;
  padding: 4px 8px; border-radius: 4px; font-size: 13px;
}
.chart-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 16px;
}
.chart-card { background: #16213e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 12px; }
.chart-card h3 { font-size: 13px; color: #aaa; margin-bottom: 8px; }
.chart-card canvas { width: 100%; height: 150px; }
.no-data { color: #555; font-style: italic; padding: 40px; text-align: center; }

/* Suggest view */
.suggest-schedule { margin-bottom: 24px; }
.suggest-schedule h3 { color: #e94560; font-size: 15px; margin-bottom: 8px; }
.suggest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.suggest-card {
  background: #16213e; border: 1px solid #2a2a4a; border-radius: 6px; padding: 10px;
}
.suggest-card .dupe-name { font-weight: bold; margin-bottom: 4px; }
.suggest-card .role { color: #4fc3f7; font-size: 12px; }
.suggest-card .reason { color: #888; font-size: 11px; }
.suggest-card .change-list { font-size: 11px; color: #aaa; margin-top: 4px; }
.suggest-card .change-list .up { color: #81c784; }
.suggest-card .change-list .down { color: #e57373; }
.coverage-warn { background: #2a1a0a; border-color: #e94560; padding: 8px 14px; border-radius: 6px; margin-bottom: 12px; color: #ffb74d; font-size: 13px; }
.coverage-ok { color: #555; font-size: 12px; margin-bottom: 12px; }

/* Geyser view */
.geyser-view { display: none; padding: 20px; max-height: calc(100vh - 50px); overflow: auto; }
.geyser-view.visible { display: block; }
.geyser-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
.geyser-world { margin-bottom: 20px; }
.geyser-world h3 { color: #e94560; font-size: 16px; margin-bottom: 10px; }
.geyser-card {
  background: #16213e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 14px;
}
.geyser-card.unanalyzed { opacity: 0.6; }
.geyser-card .geyser-header {
  display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;
}
.geyser-card .geyser-name { font-weight: bold; font-size: 14px; }
.geyser-card .geyser-status { font-size: 11px; border-radius: 3px; padding: 1px 6px; }
.geyser-card .geyser-status.studied { background: #1b5e20; color: #a5d6a7; }
.geyser-card .geyser-status.uncovered { background: #4a3800; color: #ffd54f; }
.geyser-card .geyser-status.buried { background: #333; color: #888; }
.geyser-card .geyser-element { color: #4fc3f7; font-size: 13px; margin-bottom: 6px; }
.geyser-card .geyser-pos { color: #666; font-size: 11px; }
.geyser-detail { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12px; margin-top: 8px; }
.geyser-detail .label { color: #888; }
.geyser-detail .value { color: #e0e0e0; font-family: monospace; }
.geyser-detail .value.highlight { color: #ffb74d; font-weight: bold; }
.geyser-detail .value.pool { color: #4fc3f7; font-weight: bold; }
.geyser-section { color: #ce93d8; font-size: 11px; font-weight: bold; grid-column: 1 / -1; margin-top: 6px; border-top: 1px solid #2a2a4a; padding-top: 4px; }

/* Resource view */
.resource-view { display: none; padding: 20px; max-height: calc(100vh - 50px); overflow: auto; }
.resource-view.visible { display: block; }
.resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 16px; }
.asteroid-card { background: #16213e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 16px; }
.asteroid-card h3 { color: #e94560; font-size: 16px; margin-bottom: 12px; }
.asteroid-card .start-tag { color: #4fc3f7; font-size: 12px; margin-left: 8px; }
.cat-section { margin-bottom: 4px; }
.cat-header {
  cursor: pointer; padding: 4px 8px; background: #0f3460; border-radius: 4px;
  font-size: 13px; color: #aaa; display: flex; justify-content: space-between;
  user-select: none; margin-bottom: 2px;
}
.cat-header:hover { background: #533483; color: #e0e0e0; }
.cat-header .cat-total { color: #666; font-size: 12px; }
.resource-list { padding: 2px 0 2px 12px; }
.resource-row {
  display: flex; justify-content: space-between; padding: 1px 8px;
  font-size: 13px;
}
.resource-row:hover { background: rgba(233,69,96,0.08); }
.resource-amount { color: #4fc3f7; font-family: monospace; white-space: nowrap; }
.resource-forecast { font-size: 11px; margin-left: 8px; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
.resource-forecast.fc-crit { color: #ff5252; background: rgba(255,82,82,0.15); }
.resource-forecast.fc-warn { color: #ffb74d; background: rgba(255,183,77,0.15); }
.resource-forecast.fc-ok { color: #666; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>Dupe Therapist</h1>
  <button id="gridBtn" class="active" onclick="showView('grid')">Grid</button>
  <button id="chartBtn" onclick="showView('chart')">Charts</button>
  <button id="suggestBtn" onclick="showView('suggest')">Suggest</button>
  <button id="resourceBtn" onclick="showView('resources')">Resources</button>
  <button id="geyserBtn" onclick="showView('geysers')">Geysers</button>
  <div class="sep"></div>
  <button onclick="refresh()">Refresh</button>
  <button class="commit-btn" id="commitBtn" onclick="commitChanges()" disabled>
    Commit<span class="badge" id="badge">0</span>
  </button>
  <button onclick="resetChanges()">Reset</button>
  <span class="status" id="status">Loading...</span>
</div>

<div class="bulk-bar" id="bulkBar">
  <span class="count" id="bulkCount">0</span><span class="label">selected</span>
  <div class="sep"></div>
  <button onclick="bulkZeroAll()">Zero All</button>
  <button onclick="bulkSetAll(5)">Default (5)</button>
  <div class="sep"></div>
  <span class="label">Only:</span>
  <select id="bulkOnlySelect" onchange="bulkOnly(this.value); this.selectedIndex=0;">
    <option value="">pick errand...</option>
  </select>
  <div class="sep"></div>
  <span class="label">Set</span>
  <select id="bulkChoreSelect"><option value="">errand...</option></select>
  <span class="label">to</span>
  <input type="number" id="bulkPrioVal" min="0" max="5" value="5">
  <button onclick="bulkSetOne()">Apply</button>
  <div class="sep"></div>
  <button onclick="clearSelection()">Clear</button>
</div>
<div class="grid-wrap" id="gridView">
  <table>
    <thead>
      <tr class="group-row" id="groupRow"></tr>
      <tr class="col-row" id="colRow"></tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
</div>

<div class="chart-view" id="chartView">
  <div class="chart-header">
    <h2 id="chartTitle">Select a dupe</h2>
    <select id="chartDupe" onchange="renderCharts()"><option value="">-- All dupes --</option></select>
    <select id="chartVital" onchange="renderCharts()"><option value="">-- All vitals --</option></select>
  </div>
  <div class="chart-grid" id="chartGrid"></div>
</div>

<div class="chart-view" id="suggestView">
  <div class="chart-header">
    <h2>Suggestions</h2>
    <button onclick="applySuggestions()">Apply All Suggestions</button>
  </div>
  <div id="suggestContent"></div>
</div>

<div class="geyser-view" id="geyserView">
  <div id="geyserContent"></div>
</div>

<div class="resource-view" id="resourceView">
  <div style="margin-bottom:12px;display:flex;gap:8px;align-items:center;">
    <button id="resCurrentBtn" class="active" onclick="showResSubView('current')">Current</button>
    <button id="resHistoryBtn" onclick="showResSubView('history')">History</button>
    <span id="resCurControls" style="display:contents;">
      <button onclick="toggleAllCats(false)">Collapse All</button>
      <button onclick="toggleAllCats(true)">Expand All</button>
    </span>
    <span id="resHistControls" style="display:none;">
      <select id="resHistCategory" onchange="renderResHistory()"><option value="">-- All categories --</option></select>
      <select id="resHistResource" onchange="renderResHistory()"><option value="">-- All resources --</option></select>
    </span>
  </div>
  <div id="resourceContent"></div>
  <div id="resourceHistContent" style="display:none;"></div>
</div>

<script>
let data = null;
let historyData = null;
let changes = {};
let sortCol = null;
let sortAsc = true;
let currentView = 'grid';

// Collapsed state per group, persisted to localStorage
let collapsed = JSON.parse(localStorage.getItem('dt-collapsed') || '{}');
let selected = new Set(); // set of dupe names
function toggleGroup(g) {
  collapsed[g] = !collapsed[g];
  localStorage.setItem('dt-collapsed', JSON.stringify(collapsed));
  render();
}

const PRIO_BG = [
  'hsl(230,15%,15%)', // 0 - disabled
  'hsl(210,40%,22%)', // 1
  'hsl(170,40%,25%)', // 2
  'hsl(90,40%,28%)',  // 3 - default
  'hsl(40,55%,28%)',  // 4
  'hsl(5,65%,32%)',   // 5 - highest
];

const VITALS = [
  { key: 'stress', label: 'Stress', fmt: v => v + '%',
    cls: v => v > 60 ? 'v-bad' : v > 30 ? 'v-warn' : 'v-good', color: '#e57373' },
  { key: 'calories', label: 'Calories', fmt: v => (v/1000).toFixed(0) + ' kcal',
    cls: v => v < 1000000 ? 'v-bad' : v < 2000000 ? 'v-warn' : 'v-good', color: '#ffb74d' },
  { key: 'morale', label: 'Morale',
    fmt: (v, d) => v + '/' + (d.vitals?.moraleExpectation ?? 0),
    cls: (v, d) => v < (d.vitals?.moraleExpectation ?? 0) ? 'v-bad' :
      v < (d.vitals?.moraleExpectation ?? 0) + 4 ? 'v-warn' : 'v-good', color: '#ce93d8' },
  { key: 'temperature', label: 'Temp',
    fmt: v => (typeof v === 'number' ? v.toFixed(1) : v) + 'C',
    cls: v => v > 40 ? 'v-bad' : v < 30 ? 'v-warn' : 'v-good', color: '#4fc3f7' },
  { key: 'hitPoints', label: 'HP',
    cls: v => v < 50 ? 'v-bad' : v < 80 ? 'v-warn' : 'v-good', color: '#81c784' },
  { key: 'immunity', label: 'Immune',
    cls: v => v < 30 ? 'v-bad' : v < 60 ? 'v-warn' : 'v-good', color: '#a5d6a7' },
  { key: 'breath', label: 'Breath',
    cls: v => v < 30 ? 'v-bad' : v < 60 ? 'v-warn' : 'v-good', color: '#90caf9' },
  { key: 'bladder', label: 'Bladder',
    cls: v => v > 80 ? 'v-bad' : v > 60 ? 'v-warn' : 'v-good', color: '#fff176' },
  { key: 'stamina', label: 'Stamina',
    cls: v => v < 20 ? 'v-bad' : v < 40 ? 'v-warn' : 'v-good', color: '#80cbc4' },
  { key: 'decor', label: 'Decor', cls: () => 'v-neutral', color: '#b39ddb' },
  { key: 'rads', label: 'Rads',
    cls: v => v > 200 ? 'v-bad' : v > 50 ? 'v-warn' : 'v-good', color: '#66bb6a' },
  { key: 'distanceTravelled', label: 'Distance',
    fmt: v => v > 1000000 ? (v/1000000).toFixed(1) + 'M' : v > 1000 ? (v/1000).toFixed(0) + 'k' : v,
    cls: () => 'v-neutral', color: '#78909c' },
];

const CORE_ATTRS = [
  { key: 'Strength', label: 'Strength', color: '#e57373' },
  { key: 'Athletics', label: 'Athletics', color: '#ffb74d' },
  { key: 'Learning', label: 'Learning', color: '#4fc3f7' },
  { key: 'Cooking', label: 'Cooking', color: '#ff8a65' },
  { key: 'Caring', label: 'Caring', color: '#f48fb1' },
  { key: 'Art', label: 'Art', color: '#ce93d8' },
  { key: 'Digging', label: 'Digging', color: '#a1887f' },
  { key: 'Construction', label: 'Construction', color: '#90a4ae' },
  { key: 'Machinery', label: 'Machinery', color: '#80cbc4' },
  { key: 'Ranching', label: 'Ranching', color: '#81c784' },
  { key: 'Botanist', label: 'Farming', color: '#aed581' },
];

const BIONIC_VITALS = [
  { key: 'battery', label: 'Battery', fmt: v => (v/1000).toFixed(0) + 'kJ',
    cls: v => v < 50000 ? 'v-bad' : v < 150000 ? 'v-warn' : 'v-good', color: '#00e5ff' },
  { key: 'oil', label: 'Oil',
    cls: v => v < 30 ? 'v-bad' : v < 80 ? 'v-warn' : 'v-good', color: '#ffcc02' },
  { key: 'gunk', label: 'Gunk',
    cls: v => v > 80 ? 'v-bad' : v > 50 ? 'v-warn' : 'v-good', color: '#8d6e63' },
  { key: 'oxygenTank', label: 'O2 Tank', fmt: v => v.toFixed(1) + 'kg',
    cls: v => v < 0.5 ? 'v-bad' : v < 2 ? 'v-warn' : 'v-good', color: '#4fc3f7' },
];

const DUPE_COLORS = [
  '#e94560','#4fc3f7','#81c784','#ffb74d','#ce93d8',
  '#f48fb1','#80cbc4','#fff176','#90caf9','#a5d6a7',
  '#ef5350','#42a5f5','#66bb6a','#ffa726','#ab47bc',
];

function prioBg(p, attr) {
  let base = PRIO_BG[Math.min(p, 9)];
  if (attr > 0 && p > 0) {
    let light = Math.min(attr * 1.5, 20);
    return base.replace(/(\d+)%\)$/, (_, l) => (parseInt(l) + light) + '%)');
  }
  return base;
}

function showView(view) {
  currentView = view;
  document.getElementById('gridView').style.display = view === 'grid' ? '' : 'none';
  document.getElementById('chartView').className = 'chart-view' + (view === 'chart' ? ' visible' : '');
  document.getElementById('suggestView').className = 'chart-view' + (view === 'suggest' ? ' visible' : '');
  document.getElementById('resourceView').className = 'resource-view' + (view === 'resources' ? ' visible' : '');
  document.getElementById('geyserView').className = 'geyser-view' + (view === 'geysers' ? ' visible' : '');
  document.getElementById('gridBtn').className = view === 'grid' ? 'active' : '';
  document.getElementById('chartBtn').className = view === 'chart' ? 'active' : '';
  document.getElementById('suggestBtn').className = view === 'suggest' ? 'active' : '';
  document.getElementById('resourceBtn').className = view === 'resources' ? 'active' : '';
  document.getElementById('geyserBtn').className = view === 'geysers' ? 'active' : '';
  if (view === 'chart') loadHistory();
  if (view === 'suggest') renderSuggestions();
  if (view === 'resources') { if (resSubView === 'history') loadResHistory(); else loadResources(); }
  if (view === 'geysers') loadGeysers();
}

let lastJson = '';
async function refresh() {
  try {
    const r = await fetch('/api/dupes');
    const text = await r.text();
    if (text !== lastJson) {
      lastJson = text;
      data = JSON.parse(text);
      render();
    }
    document.getElementById('status').textContent =
      data.dupes.length + ' dupes | ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
  }
}

async function loadHistory() {
  try {
    const r = await fetch('/api/history');
    historyData = await r.json();
    updateChartSelectors();
    renderCharts();
  } catch (e) {
    document.getElementById('chartGrid').innerHTML = '<div class="no-data">No history data yet. Data is recorded every 30 seconds.</div>';
  }
}

function updateChartSelectors() {
  const ds = document.getElementById('chartDupe');
  const old = ds.value;
  ds.innerHTML = '<option value="">-- All dupes --</option>';
  if (historyData) for (const n of Object.keys(historyData).sort())
    ds.innerHTML += `<option value="${esc(n)}">${esc(n)}</option>`;
  ds.value = old || '';
  const vs = document.getElementById('chartVital');
  const oldV = vs.value;
  vs.innerHTML = '<option value="">-- All vitals --</option>';
  VITALS.forEach(v => { vs.innerHTML += `<option value="${v.key}">${v.label}</option>`; });
  vs.value = oldV || '';
}

function renderCharts() {
  const grid = document.getElementById('chartGrid');
  grid.innerHTML = '';
  if (!historyData) { grid.innerHTML = '<div class="no-data">No history data yet.</div>'; return; }
  const dn = document.getElementById('chartDupe').value;
  const vk = document.getElementById('chartVital').value;
  const title = document.getElementById('chartTitle');

  if (dn) {
    title.textContent = dn;
    const dh = historyData[dn];
    if (!dh) { grid.innerHTML = '<div class="no-data">No data for this dupe.</div>'; return; }
    (vk ? VITALS.filter(v => v.key === vk) : VITALS).forEach(vd => {
      const pts = dh[vd.key];
      if (!pts || pts.length < 2) return;
      grid.appendChild(makeChartCard(vd.label, [{ name: dn, points: pts, color: vd.color }]));
    });
  } else if (vk) {
    const vd = VITALS.find(v => v.key === vk);
    title.textContent = vd.label;
    const series = []; let idx = 0;
    for (const [n, dh] of Object.entries(historyData)) {
      const pts = dh[vk];
      if (pts && pts.length >= 2) { series.push({ name: n, points: pts, color: DUPE_COLORS[idx++ % DUPE_COLORS.length] }); }
    }
    if (!series.length) { grid.innerHTML = '<div class="no-data">No data yet.</div>'; return; }
    const c = makeChartCard(vd.label + ' — All Dupes', series, true);
    c.style.gridColumn = '1 / -1';
    grid.appendChild(c);
  } else {
    title.textContent = 'All Dupes';
    VITALS.forEach(vd => {
      const series = []; let idx = 0;
      for (const [n, dh] of Object.entries(historyData)) {
        const pts = dh[vd.key];
        if (pts && pts.length >= 2) series.push({ name: n, points: pts, color: DUPE_COLORS[idx++ % DUPE_COLORS.length] });
      }
      if (series.length) grid.appendChild(makeChartCard(vd.label, series, series.length <= 8));
    });
  }
}

function makeChartCard(title, series, showLegend = false) {
  const card = document.createElement('div');
  card.className = 'chart-card';
  card.innerHTML = `<h3>${esc(title)}</h3>`;
  const canvas = document.createElement('canvas');
  canvas.width = 400; canvas.height = 150;
  card.appendChild(canvas);
  if (showLegend && series.length > 1) {
    const leg = document.createElement('div');
    leg.style.cssText = 'font-size:11px;margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;';
    series.forEach(s => { leg.innerHTML += `<span style="color:${s.color}">\u25CF ${esc(s.name)}</span>`; });
    card.appendChild(leg);
  }
  requestAnimationFrame(() => drawChart(canvas, series));
  return card;
}

function drawChart(canvas, series) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  const pad = { top: 8, right: 8, bottom: 22, left: 40 };
  const pW = W - pad.left - pad.right, pH = H - pad.top - pad.bottom;
  let mnX = Infinity, mxX = -Infinity, mnY = Infinity, mxY = -Infinity;
  series.forEach(s => s.points.forEach(([x, y]) => {
    if (x < mnX) mnX = x; if (x > mxX) mxX = x;
    if (y < mnY) mnY = y; if (y > mxY) mxY = y;
  }));
  if (mnY === mxY) { mnY -= 1; mxY += 1; }
  const rX = mxX - mnX || 1, rY = mxY - mnY;
  ctx.strokeStyle = '#2a2a4a'; ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + pH * (1 - i / 4);
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
    ctx.fillStyle = '#666'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText((mnY + rY * i / 4).toFixed(0), pad.left - 4, y + 3);
  }
  ctx.fillStyle = '#666'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  for (let i = 0; i <= 4; i++) ctx.fillText('C' + (mnX + rX * i / 4).toFixed(1), pad.left + pW * i / 4, H - 4);
  series.forEach(s => {
    ctx.strokeStyle = s.color; ctx.lineWidth = 1.5; ctx.beginPath();
    s.points.forEach(([x, y], i) => {
      const px = pad.left + ((x - mnX) / rX) * pW, py = pad.top + (1 - (y - mnY) / rY) * pH;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.stroke();
  });
}

function render() {
  if (!data) return;
  const hasDiseases = data.sicknesses && data.sicknesses.length > 0;
  const anyBionic = data.dupes.some(d => d.isBionic);

  // Sort
  let dupes = [...data.dupes];
  if (sortCol !== null) {
    dupes.sort((a, b) => {
      let va, vb;
      if (sortCol === 'name') { va = a.name; vb = b.name; }
      else if (sortCol.startsWith('attr:')) {
        const k = sortCol.slice(5); va = a.coreAttributes?.[k] ?? 0; vb = b.coreAttributes?.[k] ?? 0;
      } else if (sortCol.startsWith('vital:')) {
        const k = sortCol.slice(6);
        va = a.vitals?.[k] ?? a.bionicVitals?.[k] ?? 0;
        vb = b.vitals?.[k] ?? b.bionicVitals?.[k] ?? 0;
      } else if (sortCol.startsWith('disease:')) {
        const d = sortCol.slice(8);
        const o = { None: 0, Contact: 1, Exposed: 2, Contracted: 3, Sick: 4 };
        va = o[a.diseaseExposure?.[d]] ?? 0; vb = o[b.diseaseExposure?.[d]] ?? 0;
      } else {
        va = getEffective(a.name, sortCol, a.priorities[sortCol] ?? 0);
        vb = getEffective(b.name, sortCol, b.priorities[sortCol] ?? 0);
      }
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ? 1 : -1;
      return 0;
    });
  }

  // Define groups
  const groups = [
    { id: 'identity', label: 'Identity', cols: 5 }, // traits, interests, skills, equipment, schedule
    { id: 'attrs', label: 'Attributes', cols: CORE_ATTRS.length },
    { id: 'vitals', label: 'Vitals', cols: VITALS.length },
  ];
  if (anyBionic) groups.push({ id: 'bionic', label: 'Bionic', cols: BIONIC_VITALS.length });
  groups.push({ id: 'priorities', label: 'Priorities', cols: data.choreGroups.length });
  if (hasDiseases) groups.push({ id: 'disease', label: 'Disease', cols: data.sicknesses.length });

  // Group header row
  const gr = document.getElementById('groupRow');
  let gh = '<th rowspan="2" style="top:0;z-index:12;width:24px;cursor:pointer" onclick="selectAll()">\u2610</th>';
  gh += '<th rowspan="2" class="sort" onclick="doSort(\'name\')" style="top:0;z-index:12">Dupe</th>';
  groups.forEach(g => {
    if (collapsed[g.id]) {
      gh += `<th class="collapsed-placeholder" rowspan="2" onclick="toggleGroup('${g.id}')" title="Expand ${g.label}">${g.label}</th>`;
    } else {
      const arrow = '\u25BC';
      gh += `<th class="group" colspan="${g.cols}" onclick="toggleGroup('${g.id}')"><span class="arrow">${arrow}</span>${g.label}</th>`;
    }
  });
  gr.innerHTML = gh;

  // Column header row
  const cr = document.getElementById('colRow');
  let ch = '';

  // Identity columns
  if (!collapsed.identity) {
    ch += '<th>Traits</th><th>Interests</th><th>Skills</th><th>Equipment</th><th>Schedule</th>';
  }
  // Attribute columns
  if (!collapsed.attrs) {
    CORE_ATTRS.forEach(a => { ch += `<th class="rotated sort" onclick="doSort('attr:${a.key}')"><span>${a.label}</span></th>`; });
  }
  // Vital columns
  if (!collapsed.vitals) {
    VITALS.forEach(v => { ch += `<th class="rotated sort" onclick="doSort('vital:${v.key}')"><span>${v.label}</span></th>`; });
  }
  // Bionic columns
  if (anyBionic && !collapsed.bionic) {
    BIONIC_VITALS.forEach(v => { ch += `<th class="rotated sort" onclick="doSort('vital:${v.key}')"><span>${v.label}</span></th>`; });
  }
  // Priority columns
  if (!collapsed.priorities) {
    data.choreGroups.forEach(cg => { ch += `<th class="rotated sort" onclick="doSort('${cg.id}')"><span>${esc(cg.name)}</span></th>`; });
  }
  // Disease columns
  if (hasDiseases && !collapsed.disease) {
    data.sicknesses.forEach(s => { ch += `<th class="rotated sort" onclick="doSort('disease:${s.id}')"><span>${esc(s.name)}</span></th>`; });
  }
  cr.innerHTML = ch;

  // Body
  const body = document.getElementById('body');
  body.innerHTML = '';

  dupes.forEach(dupe => {
    const tr = document.createElement('tr');
    if (selected.has(dupe.name)) tr.className = 'selected';

    // Checkbox
    const chkTd = document.createElement('td');
    chkTd.className = 'sel-check';
    chkTd.textContent = selected.has(dupe.name) ? '\u2611' : '\u2610';
    chkTd.onclick = (e) => { e.stopPropagation(); toggleSelect(dupe.name, e); };
    tr.appendChild(chkTd);

    // Name with portrait and rename
    const nameTd = document.createElement('td');
    nameTd.className = 'name';
    const img = document.createElement('img');
    img.className = 'portrait';
    img.src = '/api/portrait?name=' + encodeURIComponent(dupe.name);
    img.onerror = function() { this.style.display = 'none'; };
    nameTd.appendChild(img);
    const nameSpan = document.createElement('span');
    nameSpan.textContent = dupe.name;
    nameSpan.onclick = () => { document.getElementById('chartDupe').value = dupe.name; showView('chart'); };
    nameTd.appendChild(nameSpan);
    if (dupe.isBionic) {
      const bt = document.createElement('span');
      bt.className = 'bionic-tag';
      bt.textContent = '[B]';
      nameTd.appendChild(bt);
    }
    const renBtn = document.createElement('span');
    renBtn.className = 'rename-btn';
    renBtn.textContent = '\u270E';
    renBtn.title = 'Rename';
    renBtn.onclick = (e) => { e.stopPropagation(); renameDupe(dupe.name); };
    nameTd.appendChild(renBtn);
    tr.appendChild(nameTd);

    // Identity group
    if (collapsed.identity) {
      tr.appendChild(emptyCell());
    } else {
      tr.innerHTML += `<td class="info" title="${esc((dupe.traits||[]).join(', '))}"><span class="trait">${esc((dupe.traits||[]).join(', '))}</span></td>`;
      tr.innerHTML += `<td class="info" title="${esc((dupe.interests||[]).join(', '))}"><span class="interest">${esc((dupe.interests||[]).join(', '))}</span></td>`;
      tr.innerHTML += `<td class="info" title="${esc((dupe.skills||[]).join(', '))}"><span class="skill">${esc((dupe.skills||[]).join(', '))}</span></td>`;
      const en = (dupe.equipment || []).map(e => e.name || e.id).join(', ');
      tr.innerHTML += `<td class="info" title="${esc(en)}"><span class="equip">${esc(en || '-')}</span></td>`;
      tr.innerHTML += `<td class="info">${esc(dupe.schedule || '-')}</td>`;
    }

    // Attributes group
    if (collapsed.attrs) {
      tr.appendChild(emptyCell());
    } else {
      CORE_ATTRS.forEach(adef => {
        const val = dupe.coreAttributes?.[adef.key] ?? 0;
        const td = document.createElement('td');
        td.className = 'vital';
        td.textContent = val;
        td.style.color = val > 10 ? '#81c784' : val > 5 ? '#aaa' : val > 0 ? '#aaa' : '#555';
        td.title = `${adef.label}: ${val}`;
        tr.appendChild(td);
      });
    }

    // Vitals group
    if (collapsed.vitals) {
      tr.appendChild(emptyCell());
    } else {
      VITALS.forEach(vdef => {
        const val = dupe.vitals?.[vdef.key] ?? 0;
        const display = vdef.fmt ? vdef.fmt(val, dupe) : val;
        const cls = vdef.cls ? vdef.cls(val, dupe) : 'v-neutral';
        const td = document.createElement('td');
        td.className = `vital ${cls}`;
        td.textContent = display;
        td.title = `${vdef.label}: ${display}`;
        tr.appendChild(td);
      });
    }

    // Bionic group
    if (anyBionic) {
      if (collapsed.bionic) {
        tr.appendChild(emptyCell());
      } else {
        BIONIC_VITALS.forEach(vdef => {
          const val = dupe.bionicVitals?.[vdef.key] ?? 0;
          const display = vdef.fmt ? vdef.fmt(val, dupe) : val;
          const cls = dupe.isBionic ? (vdef.cls ? vdef.cls(val, dupe) : 'v-neutral') : 'v-neutral';
          const td = document.createElement('td');
          td.className = `vital ${cls}`;
          td.textContent = dupe.isBionic ? display : '-';
          tr.appendChild(td);
        });
      }
    }

    // Priorities group
    if (collapsed.priorities) {
      tr.appendChild(emptyCell());
    } else {
      const disabled = new Set(dupe.disabledGroups || []);
      data.choreGroups.forEach(cg => {
        const isDisabled = disabled.has(cg.id);
        const orig = dupe.priorities[cg.id] ?? 0;
        const c = changes[dupe.name]?.[cg.id];
        const p = c !== undefined ? c : orig;
        const isChanged = c !== undefined && c !== orig;
        const attr = dupe.attributes?.[cg.id] ?? 0;
        const td = document.createElement('td');
        td.className = 'prio' + (isChanged ? ' changed' : '') + (isDisabled ? ' disabled' : '');
        td.textContent = isDisabled ? 'X' : (p === 0 ? '' : p);
        td.style.backgroundColor = isDisabled ? '' : prioBg(p, attr);
        td.title = isDisabled ? `${cg.name}: disabled by trait` : `${cg.name}: ${p} (skill: ${attr})`;
        if (isDisabled) { tr.appendChild(td); return; }
        td.onmousedown = e => {
          e.preventDefault();
          let np;
          if (e.button === 0) np = p >= 5 ? 0 : p + 1;
          else if (e.button === 2) np = p <= 0 ? 5 : p - 1;
          else return;
          if (!changes[dupe.name]) changes[dupe.name] = {};
          if (np === orig) {
            delete changes[dupe.name][cg.id];
            if (!Object.keys(changes[dupe.name]).length) delete changes[dupe.name];
          } else {
            changes[dupe.name][cg.id] = np;
          }
          updateBadge();
          render();
        };
        td.oncontextmenu = e => e.preventDefault();
        tr.appendChild(td);
      });
    }

    // Disease group
    if (hasDiseases) {
      if (collapsed.disease) {
        tr.appendChild(emptyCell());
      } else {
        data.sicknesses.forEach(sick => {
          const state = dupe.diseaseExposure?.[sick.id] || 'None';
          const td = document.createElement('td');
          let ds = state;
          if (dupe.sicknesses?.includes(sick.name)) ds = 'Sick';
          td.className = 'exposure ' + ds;
          td.textContent = ds === 'None' ? '-' : ds;
          td.title = `${sick.name}: ${ds}`;
          tr.appendChild(td);
        });
      }
    }

    body.appendChild(tr);
  });
}

function emptyCell() {
  const td = document.createElement('td');
  td.className = 'collapsed-cell';
  return td;
}

// Selection & bulk operations
function toggleSelect(name, e) {
  if (e && e.shiftKey && lastSelected && data) {
    // Range select
    const names = data.dupes.map(d => d.name);
    const a = names.indexOf(lastSelected), b = names.indexOf(name);
    const [lo, hi] = a < b ? [a, b] : [b, a];
    for (let i = lo; i <= hi; i++) selected.add(names[i]);
  } else if (selected.has(name)) {
    selected.delete(name);
  } else {
    selected.add(name);
  }
  lastSelected = name;
  updateBulkBar();
  render();
}
let lastSelected = null;

function selectAll() {
  if (!data) return;
  if (selected.size === data.dupes.length) selected.clear();
  else data.dupes.forEach(d => selected.add(d.name));
  updateBulkBar();
  render();
}

function clearSelection() { selected.clear(); updateBulkBar(); render(); }

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  bar.className = 'bulk-bar' + (selected.size > 0 ? ' visible' : '');
  document.getElementById('bulkCount').textContent = selected.size;

  // Populate chore group dropdowns
  if (data) {
    ['bulkOnlySelect', 'bulkChoreSelect'].forEach(id => {
      const sel = document.getElementById(id);
      const old = sel.value;
      sel.innerHTML = '<option value="">pick errand...</option>';
      data.choreGroups.forEach(cg => {
        sel.innerHTML += `<option value="${cg.id}">${esc(cg.name)}</option>`;
      });
      sel.value = old || '';
    });
  }
}

function bulkSetPriorities(fn) {
  if (!data) return;
  selected.forEach(name => {
    const dupe = data.dupes.find(d => d.name === name);
    if (!dupe) return;
    const disabled = new Set(dupe.disabledGroups || []);
    if (!changes[name]) changes[name] = {};
    data.choreGroups.forEach(cg => {
      if (disabled.has(cg.id)) return;
      const orig = dupe.priorities[cg.id] ?? 0;
      const newP = fn(cg.id, orig);
      if (newP !== orig) changes[name][cg.id] = newP;
      else {
        delete changes[name][cg.id];
        if (!Object.keys(changes[name]).length) delete changes[name];
      }
    });
  });
  updateBadge();
  render();
}

function bulkZeroAll() { bulkSetPriorities(() => 0); }
function bulkSetAll(n) { bulkSetPriorities(() => n); }

function bulkOnly(cgId) {
  if (!cgId) return;
  bulkSetPriorities((id) => id === cgId ? 5 : 0);
}

function bulkSetOne() {
  const cgId = document.getElementById('bulkChoreSelect').value;
  const val = parseInt(document.getElementById('bulkPrioVal').value) || 0;
  if (!cgId) return;
  bulkSetPriorities((id, orig) => id === cgId ? Math.max(0, Math.min(5, val)) : orig);
}

function getEffective(name, cgId, orig) { return changes[name]?.[cgId] ?? orig; }

function doSort(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  render();
}

function updateBadge() {
  let n = 0;
  for (const d of Object.values(changes)) n += Object.keys(d).length;
  document.getElementById('badge').textContent = n;
  document.getElementById('badge').style.display = n > 0 ? 'inline' : 'none';
  document.getElementById('commitBtn').disabled = n === 0;
}

async function commitChanges() {
  const batch = [];
  for (const [name, cgs] of Object.entries(changes))
    for (const [cgId, prio] of Object.entries(cgs))
      batch.push({ dupe: name, choreGroup: cgId, priority: prio });
  try {
    await fetch('/api/priorities', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(batch)
    });
    document.getElementById('status').textContent = `Committed ${batch.length} changes`;
    changes = {};
    updateBadge();
    setTimeout(refresh, 500);
  } catch (e) {
    document.getElementById('status').textContent = 'Commit failed: ' + e.message;
  }
}

function resetChanges() { changes = {}; updateBadge(); render(); }

async function renameDupe(oldName) {
  const newName = prompt('Rename ' + oldName + ' to:', oldName);
  if (!newName || newName === oldName) return;
  try {
    await fetch('/api/rename', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ oldName, newName })
    });
    // Update local changes keys too
    if (changes[oldName]) {
      changes[newName] = changes[oldName];
      delete changes[oldName];
    }
    if (selected.has(oldName)) {
      selected.delete(oldName);
      selected.add(newName);
    }
    setTimeout(refresh, 500);
  } catch (e) {
    alert('Rename failed: ' + e.message);
  }
}

// --- Suggestion engine ---
// Maps chore group IDs to the core attribute that drives them
const CHORE_ATTR_MAP = {
  Dig: 'Digging', Build: 'Construction', Farming: 'Botanist', Ranching: 'Ranching',
  Cook: 'Cooking', Art: 'Art', Research: 'Learning', MachineOperating: 'Machinery',
  MedicalAid: 'Caring', Combat: 'Athletics', Hauling: 'Strength',
  Basekeeping: 'Strength', Toggle: 'Athletics',
  LifeSupport: 'Athletics', Storage: 'Strength', Rocketry: 'Athletics',
};

// Maps interest names to chore group IDs
const INTEREST_TO_CHORE = {
  'Building': 'Build', 'Cooking': 'Cook', 'Decorating': 'Art',
  'Digging': 'Dig', 'Doctoring': 'MedicalAid', 'Farming': 'Farming',
  'Operating': 'MachineOperating', 'Ranching': 'Ranching',
  'Researching': 'Research', 'Rocketry': 'Rocketry',
  'Supplying': 'Hauling', 'Tidying': 'Basekeeping',
};

// Key roles that every schedule should have coverage for
const KEY_ROLES = ['Dig', 'Build', 'Cook', 'Research', 'Farm', 'Ranch', 'MachineOperating'];

// Chore groups that shouldn't be assigned as a primary role
// (reactive/incidental work, not full-time jobs)
const NON_PRIMARY = new Set(['Combat', 'Toggle', 'LifeSupport', 'Recreation', 'Basekeeping', 'Rocketry', 'Hauling', 'Storage']);

function suggestRole(dupe) {
  if (!data) return { role: null, scores: {} };
  // Score each chore group by attribute + interest bonus
  const disabled = new Set(dupe.disabledGroups || []);
  const interestChores = new Set((dupe.interests || []).map(i => INTEREST_TO_CHORE[i]).filter(Boolean));
  const scores = {};
  data.choreGroups.forEach(cg => {
    const attrKey = CHORE_ATTR_MAP[cg.id];
    const attrVal = attrKey ? (dupe.coreAttributes?.[attrKey] ?? 0) : 0;
    scores[cg.id] = attrVal + (interestChores.has(cg.id) ? 5 : 0);
  });
  // Best role (skip non-primary and trait-disabled chore groups)
  let best = null, bestScore = -1;
  for (const [id, score] of Object.entries(scores)) {
    if (NON_PRIMARY.has(id) || disabled.has(id)) continue;
    if (score > bestScore) { bestScore = score; best = id; }
  }
  return { role: best, bestScore, scores };
}

function generateSuggestions() {
  if (!data) return { byDupe: {}, coverage: {} };
  const byDupe = {};
  const scheduleMap = {}; // schedule -> [{dupe, role}]

  data.dupes.forEach(dupe => {
    const { role, bestScore, scores } = suggestRole(dupe);
    const sched = dupe.schedule || 'Default';
    if (!scheduleMap[sched]) scheduleMap[sched] = [];

    // Generate priority changes: primary role=9, related roles=5, others=3, disable=0
    const dupeDisabled = new Set(dupe.disabledGroups || []);
    // Rank eligible chore groups by score to find top roles
    const ranked = Object.entries(scores)
      .filter(([id]) => !dupeDisabled.has(id) && !NON_PRIMARY.has(id))
      .sort((a, b) => b[1] - a[1]);
    const topIds = new Set(ranked.slice(0, 3).filter(([,s]) => s > 0).map(([id]) => id));

    const suggested = {};
    data.choreGroups.forEach(cg => {
      if (dupeDisabled.has(cg.id)) return; // don't touch disabled groups
      if (cg.id === role) suggested[cg.id] = 5;
      else if (topIds.has(cg.id)) suggested[cg.id] = 4;
      else suggested[cg.id] = 3;
    });

    const cgName = data.choreGroups.find(c => c.id === role)?.name || role;
    byDupe[dupe.name] = { role, roleName: cgName, suggested, scores, schedule: sched };
    scheduleMap[sched].push({ name: dupe.name, role });
  });

  // Check coverage per schedule
  const coverage = {};
  for (const [sched, dupes] of Object.entries(scheduleMap)) {
    const missing = [];
    KEY_ROLES.forEach(roleId => {
      const has = dupes.some(d => d.role === roleId);
      if (!has) {
        const name = data.choreGroups.find(c => c.id === roleId)?.name || roleId;
        missing.push(name);
      }
    });
    coverage[sched] = { count: dupes.length, missing };
  }

  return { byDupe, coverage };
}

function renderSuggestions() {
  const container = document.getElementById('suggestContent');
  if (!data) { container.innerHTML = '<div class="no-data">No data loaded.</div>'; return; }

  const { byDupe, coverage } = generateSuggestions();
  let html = '';

  // Group by schedule
  const schedGroups = {};
  data.dupes.forEach(d => {
    const sched = d.schedule || 'Default';
    if (!schedGroups[sched]) schedGroups[sched] = [];
    schedGroups[sched].push(d);
  });

  for (const [sched, dupes] of Object.entries(schedGroups)) {
    html += `<div class="suggest-schedule"><h3>${esc(sched)} (${dupes.length} dupes)</h3>`;

    // Coverage warnings
    const cov = coverage[sched];
    if (cov && cov.missing.length > 0) {
      html += `<div class="coverage-warn">Missing coverage: ${cov.missing.join(', ')}</div>`;
    } else {
      html += `<div class="coverage-ok">All key roles covered</div>`;
    }

    html += '<div class="suggest-grid">';
    dupes.forEach(dupe => {
      const sg = byDupe[dupe.name];
      if (!sg) return;

      // Show what would change
      let changeHtml = '';
      data.choreGroups.forEach(cg => {
        const orig = dupe.priorities[cg.id] ?? 0;
        const newP = sg.suggested[cg.id] ?? orig;
        if (newP !== orig) {
          const cls = newP > orig ? 'up' : 'down';
          const arrow = newP > orig ? '\u2191' : '\u2193';
          changeHtml += `<span class="${cls}">${cg.name}: ${orig}\u2192${newP} ${arrow}</span> `;
        }
      });

      html += `<div class="suggest-card">`;
      html += `<div class="dupe-name">${esc(dupe.name)}${dupe.isBionic ? ' <span class="bionic-tag">[B]</span>' : ''}</div>`;
      html += `<div class="role">Suggested: ${esc(sg.roleName)} (score: ${sg.scores[sg.role] || 0})</div>`;

      const topAttrs = Object.entries(dupe.coreAttributes || {})
        .filter(([,v]) => v > 0).sort((a,b) => b[1] - a[1]).slice(0, 3)
        .map(([k,v]) => `${k}:${v}`).join(', ');
      html += `<div class="reason">Top: ${topAttrs || 'none'} | Interests: ${(dupe.interests||[]).join(', ') || 'none'}</div>`;

      if (changeHtml) html += `<div class="change-list">${changeHtml}</div>`;
      else html += `<div class="change-list" style="color:#555">No changes needed</div>`;
      html += `</div>`;
    });
    html += '</div></div>';
  }

  container.innerHTML = html;
}

function applySuggestions() {
  if (!data) return;
  const { byDupe } = generateSuggestions();
  for (const [name, sg] of Object.entries(byDupe)) {
    const dupe = data.dupes.find(d => d.name === name);
    if (!dupe) continue;
    data.choreGroups.forEach(cg => {
      const orig = dupe.priorities[cg.id] ?? 0;
      const newP = sg.suggested[cg.id] ?? orig;
      if (newP !== orig) {
        if (!changes[name]) changes[name] = {};
        changes[name][cg.id] = newP;
      }
    });
  }
  updateBadge();
  showView('grid');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = strip(s);
  return d.innerHTML;
}

function strip(s) {
  if (!s || s.indexOf('<') < 0) return s || '';
  return s.replace(/<[^>]+>/g, '');
}

// --- Resources ---
let resourceData = null;

let resForecast = {}; // resourceName -> cycles until depletion (null = stable/growing)

async function loadResources() {
  try {
    const [rr, rh] = await Promise.all([fetch('/api/resources'), fetch('/api/resource-history')]);
    resourceData = await rr.json();
    const hist = await rh.json();
    resForecast = calcForecasts(hist);
    renderResources();
  } catch(e) {
    try {
      const r = await fetch('/api/resources');
      resourceData = await r.json();
      resForecast = {};
      renderResources();
    } catch(e2) {
      document.getElementById('resourceContent').innerHTML = '<div class="no-data">Failed to load resources.</div>';
    }
  }
}

function calcForecasts(hist) {
  const fc = {};
  for (const [name, info] of Object.entries(hist)) {
    const pts = info.points;
    if (pts.length < 2) continue;
    // Find points spanning roughly the last 2 cycles
    const lastCycle = pts[pts.length - 1][0];
    const cutoff = lastCycle - 2;
    let startIdx = pts.length - 1;
    for (let i = pts.length - 1; i >= 0; i--) {
      if (pts[i][0] < cutoff) { startIdx = i; break; }
    }
    if (startIdx === pts.length - 1) startIdx = 0; // not enough span, use all
    const dt = pts[pts.length - 1][0] - pts[startIdx][0];
    if (dt <= 0) continue;
    const dv = pts[pts.length - 1][1] - pts[startIdx][1];
    const rate = dv / dt; // per cycle
    const current = pts[pts.length - 1][1];
    if (rate < 0 && current > 0) {
      fc[name] = -current / rate; // cycles until zero
    }
  }
  return fc;
}

function renderResources() {
  const c = document.getElementById('resourceContent');
  if (!resourceData?.worlds?.length) { c.innerHTML = '<div class="no-data">No resource data.</div>'; return; }
  let h = '<div class="resource-grid">';
  resourceData.worlds.filter(w => w.categories?.length).forEach(w => {
    h += `<div class="asteroid-card"><h3>${esc(w.name)}${w.isStartWorld ? '<span class="start-tag">[Start]</span>' : ''}</h3>`;
    w.categories.forEach(cat => {
      const total = cat.resources.reduce((s, r) => s + r[1], 0);
      h += `<div class="cat-section"><div class="cat-header" onclick="toggleCat(this)">`;
      h += `<span><span class="arrow">\u25BC</span> ${esc(cat.name)} (${cat.resources.length})</span>`;
      h += `<span class="cat-total">${fmtRes(total, cat.unit)}</span></div>`;
      h += `<div class="resource-list">`;
      cat.resources.forEach(([name, amount]) => {
        const fcHtml = fmtForecast(resForecast[name]);
        h += `<div class="resource-row"><span>${esc(name)}${fcHtml}</span><span class="resource-amount">${fmtRes(amount, cat.unit)}</span></div>`;
      });
      h += `</div></div>`;
    });
    h += `</div>`;
  });
  h += '</div>';
  c.innerHTML = h;
}

function toggleCat(el) {
  const list = el.nextElementSibling;
  const hidden = list.style.display === 'none';
  list.style.display = hidden ? '' : 'none';
  el.querySelector('.arrow').textContent = hidden ? '\u25BC' : '\u25B6';
}

function toggleAllCats(expand) {
  document.querySelectorAll('#resourceContent .cat-header').forEach(el => {
    el.nextElementSibling.style.display = expand ? '' : 'none';
    el.querySelector('.arrow').textContent = expand ? '\u25BC' : '\u25B6';
  });
}

function fmtRes(v, unit) {
  if (unit === 'calories') return (v / 1000).toFixed(0) + ' kcal';
  if (unit === 'units') return Math.round(v).toLocaleString();
  if (v >= 1000) return (v / 1000).toFixed(1) + ' t';
  if (v >= 1) return v.toFixed(1) + ' kg';
  return (v * 1000).toFixed(0) + ' g';
}

function fmtForecast(cycles) {
  if (cycles == null || cycles > 100) return '';
  const cls = cycles < 3 ? 'fc-crit' : cycles < 10 ? 'fc-warn' : 'fc-ok';
  const label = cycles < 1 ? `~${(cycles * 600).toFixed(0)}s` : `~${cycles.toFixed(1)} cycles`;
  return `<span class="resource-forecast ${cls}">\u26a0 ${label}</span>`;
}

// --- Resource History ---
let resHistData = null;
let resSubView = 'current';

const RES_COLORS = [
  '#4fc3f7','#e94560','#81c784','#ffb74d','#ce93d8',
  '#f48fb1','#80cbc4','#fff176','#90caf9','#a5d6a7',
  '#ef5350','#42a5f5','#66bb6a','#ffa726','#ab47bc',
];

function showResSubView(sub) {
  resSubView = sub;
  document.getElementById('resCurrentBtn').className = sub === 'current' ? 'active' : '';
  document.getElementById('resHistoryBtn').className = sub === 'history' ? 'active' : '';
  document.getElementById('resCurControls').style.display = sub === 'current' ? 'contents' : 'none';
  document.getElementById('resHistControls').style.display = sub === 'history' ? 'contents' : 'none';
  document.getElementById('resourceContent').style.display = sub === 'current' ? '' : 'none';
  document.getElementById('resourceHistContent').style.display = sub === 'history' ? '' : 'none';
  if (sub === 'history') loadResHistory();
  if (sub === 'current') loadResources();
}

async function loadResHistory() {
  try {
    const r = await fetch('/api/resource-history');
    resHistData = await r.json();
    updateResHistSelectors();
    renderResHistory();
  } catch(e) {
    document.getElementById('resourceHistContent').innerHTML = '<div class="no-data">No resource history yet. Data is recorded every 30 seconds.</div>';
  }
}

function updateResHistSelectors() {
  if (!resHistData) return;
  // Build category list from current resource data
  const cats = new Set();
  const resCats = {}; // resourceName -> unit (as proxy for category grouping)
  for (const [name, info] of Object.entries(resHistData)) {
    cats.add(info.unit);
    resCats[name] = info.unit;
  }
  const catSel = document.getElementById('resHistCategory');
  const oldCat = catSel.value;
  catSel.innerHTML = '<option value="">-- All --</option>';
  for (const c of [...cats].sort()) {
    const label = c === 'mass' ? 'Materials' : c === 'calories' ? 'Food' : 'Units';
    catSel.innerHTML += `<option value="${c}">${label}</option>`;
  }
  catSel.value = oldCat || '';
  updateResHistResourceSelector();
}

function updateResHistResourceSelector() {
  if (!resHistData) return;
  const catFilter = document.getElementById('resHistCategory').value;
  const resSel = document.getElementById('resHistResource');
  const old = resSel.value;
  resSel.innerHTML = '<option value="">-- All resources --</option>';
  const names = Object.keys(resHistData).filter(n => !catFilter || resHistData[n].unit === catFilter).sort();
  for (const n of names) resSel.innerHTML += `<option value="${esc(n)}">${esc(n)}</option>`;
  resSel.value = old || '';
}

function renderResHistory() {
  updateResHistResourceSelector();
  const grid = document.getElementById('resourceHistContent');
  if (!resHistData || !Object.keys(resHistData).length) {
    grid.innerHTML = '<div class="no-data">No resource history yet. Data is recorded every 30 seconds.</div>';
    return;
  }
  const catFilter = document.getElementById('resHistCategory').value;
  const resFilter = document.getElementById('resHistResource').value;

  grid.innerHTML = '';
  const container = document.createElement('div');
  container.className = 'chart-grid';

  if (resFilter) {
    // Single resource — one big chart
    const info = resHistData[resFilter];
    if (!info || info.points.length < 2) { grid.innerHTML = '<div class="no-data">Not enough data for this resource.</div>'; return; }
    const card = makeChartCard(resFilter + ' (' + fmtResUnit(info.unit) + ')', [{ name: resFilter, points: info.points, color: RES_COLORS[0] }]);
    card.style.gridColumn = '1 / -1';
    container.appendChild(card);
  } else {
    // Group by unit type, show top resources per group
    const groups = {};
    for (const [name, info] of Object.entries(resHistData)) {
      if (catFilter && info.unit !== catFilter) continue;
      if (info.points.length < 2) continue;
      if (!groups[info.unit]) groups[info.unit] = [];
      const lastVal = info.points[info.points.length - 1][1];
      groups[info.unit].push({ name, info, lastVal });
    }
    for (const unit of Object.keys(groups).sort()) {
      const items = groups[unit].sort((a, b) => b.lastVal - a.lastVal);
      // Show top 12 as individual charts
      const shown = items.slice(0, 12);
      shown.forEach((item, idx) => {
        const card = makeChartCard(item.name, [{ name: item.name, points: item.info.points, color: RES_COLORS[idx % RES_COLORS.length] }]);
        container.appendChild(card);
      });
      if (items.length > 12) {
        const note = document.createElement('div');
        note.className = 'no-data';
        note.textContent = `+ ${items.length - 12} more ${fmtResUnit(unit)} resources (use filter to view)`;
        note.style.gridColumn = '1 / -1';
        container.appendChild(note);
      }
    }
  }

  if (!container.children.length) {
    grid.innerHTML = '<div class="no-data">No matching resource history.</div>';
    return;
  }
  grid.appendChild(container);
}

function fmtResUnit(unit) {
  return unit === 'mass' ? 'materials' : unit === 'calories' ? 'food' : 'units';
}

// --- Geysers ---
let geyserData = null;

async function loadGeysers() {
  try {
    const r = await fetch('/api/geysers');
    geyserData = await r.json();
    renderGeysers();
  } catch(e) {
    document.getElementById('geyserContent').innerHTML = '<div class="no-data">Failed to load geyser data.</div>';
  }
}

function renderGeysers() {
  const c = document.getElementById('geyserContent');
  if (!geyserData?.geysers?.length) { c.innerHTML = '<div class="no-data">No geysers found.</div>'; return; }

  // Group by world
  const byWorld = {};
  geyserData.geysers.forEach(g => {
    const wn = g.worldName || 'Unknown';
    if (!byWorld[wn]) byWorld[wn] = [];
    byWorld[wn].push(g);
  });

  let h = '';
  for (const [world, geysers] of Object.entries(byWorld).sort((a,b) => a[0].localeCompare(b[0]))) {
    h += `<div class="geyser-world"><h3>${esc(world)} (${geysers.length})</h3><div class="geyser-grid">`;
    geysers.forEach(g => { h += renderGeyserCard(g); });
    h += '</div></div>';
  }
  c.innerHTML = h;
}

function renderGeyserCard(g) {
  const status = g.studied ? 'studied' : g.uncovered ? 'uncovered' : 'buried';
  const statusLabel = g.studied ? 'Analyzed' : g.uncovered ? 'Uncovered' : 'Buried';
  let h = `<div class="geyser-card${g.studied ? '' : ' unanalyzed'}">`;
  h += `<div class="geyser-header"><span class="geyser-name">${esc(g.name)}</span>`;
  h += `<span class="geyser-status ${status}">${statusLabel}</span></div>`;
  h += `<div class="geyser-element">${esc(g.element)} (${g.elementState}) @ ${g.temperature.toFixed(1)}\u00B0C</div>`;
  h += `<div class="geyser-pos">(${g.x}, ${g.y})</div>`;

  if (g.studied) {
    const CYCLE = 600; // seconds per cycle
    const massPerEruption = g.emitRate * g.onDuration;
    const eruptionsPerSeason = g.yearOnDuration / g.iterationLength;
    const massPerSeason = eruptionsPerSeason * massPerEruption;

    h += '<div class="geyser-detail">';

    // Eruption timing
    h += '<div class="geyser-section">Eruption Cycle</div>';
    h += `<span class="label">Emit rate</span><span class="value">${fmtMassRate(g.emitRate)}</span>`;
    h += `<span class="label">Erupting</span><span class="value">${fmtDuration(g.onDuration)} (${(g.iterationPercent*100).toFixed(0)}%)</span>`;
    h += `<span class="label">Idle</span><span class="value">${fmtDuration(g.offDuration)}</span>`;
    h += `<span class="label">Per eruption</span><span class="value highlight">${fmtMass(massPerEruption)}</span>`;

    // Season timing
    h += '<div class="geyser-section">Active Season</div>';
    h += `<span class="label">Active</span><span class="value">${fmtDuration(g.yearOnDuration)} (${(g.yearPercent*100).toFixed(0)}%)</span>`;
    h += `<span class="label">Dormant</span><span class="value">${fmtDuration(g.yearOffDuration)}</span>`;
    h += `<span class="label">Eruptions</span><span class="value">${eruptionsPerSeason.toFixed(1)}</span>`;

    // Storage / output summary
    h += '<div class="geyser-section">Output</div>';
    h += `<span class="label">Per active season</span><span class="value highlight">${fmtMass(massPerSeason)}</span>`;
    h += `<span class="label">Average (long-term)</span><span class="value">${fmtMassRate(g.averageEmission)}</span>`;
    h += `<span class="label">Avg per cycle</span><span class="value">${fmtMass(g.averageEmission * CYCLE)}</span>`;
    h += `<span class="label">Overpressure</span><span class="value">${fmtMass(g.maxPressure)}</span>`;

    // Pool sizing (liquid/molten only)
    if (g.elementState === 'liquid' || g.elementState === 'solid') {
      h += '<div class="geyser-section">Pool Sizing</div>';
      const kgPerCell = 1000;
      const cellsPerEruption = Math.ceil(massPerEruption / kgPerCell);
      const cellsPerSeason = Math.ceil(massPerSeason / kgPerCell);
      h += `<span class="label">Per eruption</span><span class="value pool">${cellsPerEruption} cell${cellsPerEruption !== 1 ? 's' : ''}</span>`;
      h += `<span class="label">Per active season</span><span class="value pool">${cellsPerSeason} cell${cellsPerSeason !== 1 ? 's' : ''}</span>`;
      h += `<span class="label"></span><span class="value" style="color:#666;font-size:11px">@ ${fmtMass(kgPerCell)}/cell</span>`;
    }

    h += '</div>';
  }

  h += '</div>';
  return h;
}

function fmtMass(kg) {
  if (kg >= 1000) return (kg / 1000).toFixed(1) + ' t';
  if (kg >= 1) return kg.toFixed(1) + ' kg';
  return (kg * 1000).toFixed(0) + ' g';
}

function fmtMassRate(kgPerSec) {
  if (kgPerSec >= 1) return kgPerSec.toFixed(1) + ' kg/s';
  return (kgPerSec * 1000).toFixed(0) + ' g/s';
}

function fmtDuration(seconds) {
  const cycles = seconds / 600;
  if (cycles >= 1) return cycles.toFixed(1) + ' cycles';
  return seconds.toFixed(0) + 's';
}

refresh();
setInterval(() => {
  refresh();
  if (currentView === 'resources') { if (resSubView === 'history') loadResHistory(); else loadResources(); }
  if (currentView === 'geysers') loadGeysers();
}, 5000);
</script>
